.wrap{overflow-x:auto}

td.t{white-space:nowrap;color:var(--mute);font-variant-numeric:tabular-nums;width:14%;padding-right:22px}
td.n{font-weight:500;width:38%}
td.n:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot);margin-right:12px;vertical-align:2px}
td.d{color:var(--mute);font-size:1.02rem}
tr.k-etude td.n:before,tr.k-projet td.n:before,tr.k-culture td.n:before{background:var(--ink)}
tr.k-pause td.n,tr.k-trajet td.n{font-weight:400;color:var(--mute)}
tr.now{background:var(--hl)}
tr.now td:first-child{box-shadow:inset 3px 0 0 var(--ink);padding-left:10px}
.foot{margin-top:26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:.95rem}
.foot button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
@media(max-width:560px){table{font-size:1.05rem}td.t{width:auto}td.n{width:auto}h1{font-size:2.2rem}td.d{display:none}th:last-child{display:none}main{padding-top:30px}}

td input,td select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
td.t input{min-width:130px}
.cell{display:flex;gap:6px}.cell select{width:auto}
.cell button{border:0;background:none;color:var(--mute);font-size:1.3rem;cursor:pointer}
body.ed td.d{display:table-cell}body.ed th:last-child{display:table-cell}body.ed main{padding-bottom:110px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar span{color:var(--mute);font-size:.9rem}
.b{font:inherit;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.b.g{background:none;color:var(--ink);border:1px solid var(--line)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px}
#dlg>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:380px;width:100%}
#dlg h2{font-family:Newsreader,Georgia,serif;font-weight:500;margin:0 0 6px;font-size:1.5rem}
#dlg p{color:var(--mute);margin:0 0 14px;font-size:.95rem}
#dlg input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);margin-bottom:10px}
#dlg .row{display:flex;gap:8px;justify-content:flex-end}
#msg{color:#b3402a;font-size:.88rem;min-height:1.2em;margin:0 0 8px}
</style>

<script>
const DATA=JSON.parse(document.getElementById("data").textContent);
const J=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const K={etude:"Études",projet:"Projet",culture:"Culture",sport:"Sport",cours:"Cours",trajet:"Trajet",pause:"Pause",base:"Base"};
let adm=false;try{adm=sessionStorage.getItem("adm")==="1"}catch(e){}
const today=(new Date().getDay()+6)%7;let cur=today;
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=v=>{const m=/(\d+)h(\d*)/.exec(v);return m?+m[1]*60+(+m[2]||0):0};
function isNow(r){if(cur!==today)return false;const n=new Date(),x=n.getHours()*60+n.getMinutes(),pr=String(r[0]).split("-");
 if(pr.length<2)return false;return x>=mins(pr[0])&&x<mins(pr[1]);}
function render(){
 document.body.className=adm?"ed":"";
 $("tabs").innerHTML=J.map((j,i)=>`<button role="tab" aria-selected="${i===cur}" data-i="${i}">${j}</button>`).join("");
 const rows=DATA.days[cur];
 $("tb").innerHTML=adm?rows.map((r,i)=>`<tr class="k-${r[2]}" data-r="${i}"><td class="t"><input data-f="0" value="${esc(r[0])}"></td><td class="n"><input data-f="1" value="${esc(r[1])}"></td><td class="d"><div class="cell"><input data-f="3" value="${esc(r[3])}"><select data-f="2">${Object.keys(K).map(k=>`<option value="${k}"${k===r[2]?" selected":""}>${K[k]}</option>`).join("")}</select><button data-del="${i}" aria-label="Supprimer la ligne">×</button></div></td></tr>`).join("")
 :rows.map(r=>`<tr class="k-${r[2]}${isNow(r)?" now":""}"><td class="t">${esc(r[0])}</td><td class="n">${esc(r[1])}</td><td class="d">${esc(r[3])}</td></tr>`).join("");
 const old=$("bar");if(old)old.remove();
 if(adm){const b=document.createElement("div");b.id="bar";b.innerHTML='<button class="b g" id="add">Ajouter une ligne</button><button class="b" id="save">Enregistrer (télécharger)</button><button class="b g" id="quit">Quitter</button><span id="st"></span>';document.body.appendChild(b);}
}
document.addEventListener("input",e=>{const t=e.target,tr=t.closest&&t.closest("tr[data-r]");if(!tr)return;
 DATA.days[cur][+tr.dataset.r][+t.dataset.f]=t.value;if(t.dataset.f==="2")tr.className="k-"+t.value;});
async function sha(v){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function api(){return window.claude?await window.claude.use("artifact"):null;}
async function persist(){
 const c=document.documentElement.cloneNode(true);c.querySelector("#tb").innerHTML="";c.querySelector("#tabs").innerHTML="";
 ["bar","dlg"].forEach(i=>{const n=c.querySelector("#"+i);if(n)n.remove()});c.querySelector("body").className="";
 c.querySelector("#data").textContent=JSON.stringify(DATA).replace(/</g,"\\u003c");
 const html="<!DOCTYPE html>\n"+c.outerHTML;
 const dl=window.claude?await window.claude.use("downloads"):null;
 if(dl){await dl.save({filename:"index.html",data:html});return;}
 const u=URL.createObjectURL(new Blob([html],{type:"text/html"}));const l=document.createElement("a");l.href=u;l.download="index.html";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function openDlg(){const first=!DATA.pw,d=document.createElement("div");d.id="dlg";
 d.innerHTML=`<div role="dialog" aria-modal="true"><h2>${first?"Créer un mot de passe":"Espace admin"}</h2><p>${first?"Choisis un mot de passe (6 caractères minimum) pour modifier ton planning.":"Entre ton mot de passe pour modifier le planning."}</p><input type="password" id="pw" autocomplete="${first?"new-password":"current-password"}" placeholder="Mot de passe"><div id="msg"></div><div class="row"><button class="b g" id="no">Annuler</button><button class="b" id="ok">Valider</button></div></div>`;
 document.body.appendChild(d);$("pw").focus();
 const msg=t=>{$("msg").textContent=t};
 const go=async()=>{const v=$("pw").value;
  if(!(window.crypto&&crypto.subtle))return msg("Navigateur non compatible.");
  if(first){if(v.length<6)return msg("6 caractères minimum.");
   if(!(await api()))return msg("Enregistrement impossible : ouvre la page depuis ton compte.");
   DATA.salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
   DATA.pw=await sha(DATA.salt+v);try{sessionStorage.setItem("adm","1")}catch(e){}
   try{await persist();}catch(e){DATA.pw="";msg("Enregistrement refusé : seul le propriétaire peut modifier cette page.");}return;}
  if(await sha(DATA.salt+v)!==DATA.pw)return msg("Mot de passe incorrect.");
  adm=true;try{sessionStorage.setItem("adm","1")}catch(e){}d.remove();render();};
 $("ok").onclick=go;$("no").onclick=()=>d.remove();
 $("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();if(e.key==="Escape")d.remove();});}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-i]");if(t){cur=+t.dataset.i;render();return;}
 const del=e.target.closest("[data-del]");if(del){DATA.days[cur].splice(+del.dataset.del,1);render();return;}
 if(e.target.id==="admin"){adm?null:openDlg();}
 if(e.target.id==="add"){DATA.days[cur].push(["","Nouvelle activité","pause",""]);render();window.scrollTo(0,document.body.scrollHeight);}
 if(e.target.id==="quit"){adm=false;try{sessionStorage.removeItem("adm")}catch(x){}render();}
 if(e.target.id==="save"){const st=$("st");st.textContent="Enregistrement…";
  try{await persist();st.textContent="index.html téléchargé : remplace-le dans ton dépôt.";}catch(x){st.textContent="Échec du téléchargement.";}}
});
(function(){const d=Math.ceil((new Date(2027,0,15)-new Date())/864e5);
 $("exam").textContent=d>0?"Examens à la mi-janvier : environ "+d+" jours.":"";})();
render();setInterval(()=>{if(!adm)render()},60000);
</script>
